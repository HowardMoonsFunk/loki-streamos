#
# /etc/pacman.conf
#
# Loki StreamOS minimal Arch configuration
# Stripped down for appliance use: core packages only

[options]
Architecture = x86_64
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# Reduced number of parallel downloads for appliance
ParallelDownloads = 3

# Use all cores for makepkg (host only — not copied into chroot pacman.conf)
# MAKEFLAGS="-j$(nproc)"

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# AUR support (optional, commented by default)
# [aur]
# Server = https://aur.archlinux.org/packages

# Multilib not needed (32-bit gaming libraries, if needed, uncomment)
# [multilib]
# Include = /etc/pacman.d/mirrorlist
