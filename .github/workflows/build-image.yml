name: Build Loki StreamOS Image

on:
  push:
    branches:
      - main
      - dev
      - develop
    paths:
      - 'base/**'
      - 'hardware/**'
      - 'launcher/**'
      - 'scripts/**'
      - 'tools/flash/**'
      - '.github/workflows/build-image.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Bootable Image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build host
        run: |
          pacman -Syu --noconfirm
          pacman -Scc --noconfirm || true
          pacman -S --noconfirm \
            arch-install-scripts \
            parted \
            util-linux \
            dosfstools \
            mtools \
            squashfs-tools \
            efibootmgr \
            wayland \
            libxkbcommon \
            cairo \
            pango \
            pkgconf \
            gcc \
            make \
            git \
            coreutils
          echo "=== Disk before build ==="
          df -h /

      - name: Build Loki StreamOS image
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/build-image.sh scripts/diagnostics.sh \
            scripts/streamos-input-test.sh scripts/streamos-storage-status.sh \
            scripts/validate-image.sh launcher/menu.sh \
            tools/flash/flash-streamos.sh tools/flash/tests/run-dry-run-tests.sh
          bash ./scripts/build-image.sh

      - name: Verify checksum file
        run: |
          cd build-artifacts
          ls -lh
          test -f loki-streamos-*.img
          test -f loki-streamos-*.sha256
          sha256sum -c loki-streamos-*.sha256
          file loki-streamos-*.img

      - name: Structurally validate image
        run: |
          bash ./scripts/validate-image.sh build-artifacts/loki-streamos-*.img

      - name: Flash tool dry-run tests
        run: |
          bash ./tools/flash/tests/run-dry-run-tests.sh

      # Sparse .img files (truncate) hash the full logical size locally, but
      # upload-artifact only transports allocated blocks (~2 GiB), so a separately
      # downloaded image fails sha256sum -c. Materialize holes to zeros once the
      # image is finalized, then regenerate the checksum from those exact bytes.
      - name: Materialize image and regenerate checksum for artifact transport
        run: |
          cd build-artifacts
          img="$(ls loki-streamos-*.img)"
          logical="$(stat -c%s "$img")"
          allocated="$(du -b "$img" | cut -f1)"
          echo "Before materialize: logical=$logical bytes, allocated=$allocated bytes"
          if [[ "$logical" != "$allocated" ]]; then
            if ! fallocate -l "$logical" "$img" 2>/dev/null; then
              echo "fallocate unavailable; copying to materialize sparse holes"
              dd if="$img" of="${img}.materialized" bs=16M conv=fsync status=progress
              mv "${img}.materialized" "$img"
            fi
            sync
          fi
          logical="$(stat -c%s "$img")"
          allocated="$(du -b "$img" | cut -f1)"
          echo "After materialize: logical=$logical bytes, allocated=$allocated bytes"
          test "$logical" -eq "$allocated"
          sum_file="${img%.img}.sha256"
          rm -f "${img}.sha256"
          sha256sum "$(basename "$img")" > "$(basename "$sum_file")"
          sha256sum -c "$(basename "$sum_file")"

      - name: Report artifact metadata
        run: |
          cd build-artifacts
          echo "commit=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "img=$(ls loki-streamos-*.img)" >> "$GITHUB_STEP_SUMMARY"
          echo "size=$(du -h loki-streamos-*.img | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256=$(cat loki-streamos-*.sha256)" >> "$GITHUB_STEP_SUMMARY"
          df -h /

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: loki-streamos-release
          path: |
            build-artifacts/loki-streamos-*.img
            build-artifacts/loki-streamos-*.sha256
          compression-level: 0
          retention-days: 30

      - name: Upload bmap (optional)
        uses: actions/upload-artifact@v4
        with:
          name: loki-streamos-bmap
          path: build-artifacts/*.bmap
          retention-days: 30
          if-no-files-found: ignore

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/loki-streamos-*.img
            build-artifacts/*.sha256
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify Build Artifacts
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release artifact bundle
        uses: actions/download-artifact@v4
        with:
          name: loki-streamos-release
          path: artifacts

      - name: Verify image integrity
        run: |
          cd artifacts
          img="$(ls loki-streamos-*.img)"
          sum="${img%.img}.sha256"
          ls -lh "$img" "$sum"
          test -f "$img"
          test -f "$sum"
          sha256sum -c "$sum"
          file "$img"
          logical="$(stat -c%s "$img")"
          allocated="$(du -b "$img" | cut -f1)"
          echo "logical=$logical allocated=$allocated"
          test "$logical" -eq "$allocated"
