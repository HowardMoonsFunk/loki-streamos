name: Build Loki StreamOS Image

on:
  push:
    branches:
      - main
      - dev
      - develop
    paths:
      - 'base/**'
      - 'hardware/**'
      - 'launcher/**'
      - 'scripts/**'
      - '.github/workflows/build-image.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Bootable Image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build host
        run: |
          pacman -Syu --noconfirm
          pacman -Scc --noconfirm || true
          pacman -S --noconfirm \
            arch-install-scripts \
            parted \
            util-linux \
            dosfstools \
            mtools \
            squashfs-tools \
            efibootmgr \
            meson \
            ninja \
            wayland \
            wayland-protocols \
            libxkbcommon \
            cairo \
            pango \
            scdoc \
            pkgconf \
            gcc \
            git \
            coreutils
          echo "=== Disk before build ==="
          df -h /

      - name: Build Loki StreamOS image
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/build-image.sh scripts/diagnostics.sh \
            scripts/streamos-input-test.sh scripts/streamos-storage-status.sh \
            scripts/validate-image.sh launcher/menu.sh
          bash ./scripts/build-image.sh

      - name: Verify checksum file
        run: |
          cd build-artifacts
          ls -lh
          test -f loki-streamos-*.img
          test -f loki-streamos-*.sha256
          sha256sum -c loki-streamos-*.sha256
          file loki-streamos-*.img

      - name: Structurally validate image
        run: |
          bash ./scripts/validate-image.sh build-artifacts/loki-streamos-*.img

      - name: Report artifact metadata
        run: |
          cd build-artifacts
          echo "commit=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "img=$(ls loki-streamos-*.img)" >> "$GITHUB_STEP_SUMMARY"
          echo "size=$(du -h loki-streamos-*.img | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256=$(cat loki-streamos-*.sha256)" >> "$GITHUB_STEP_SUMMARY"
          df -h /

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: loki-streamos-image
          path: build-artifacts/loki-streamos-*.img
          retention-days: 30

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: loki-streamos-checksums
          path: build-artifacts/*.sha256
          retention-days: 30

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/loki-streamos-*.img
            build-artifacts/*.sha256
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify Build Artifacts
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Verify image integrity
        run: |
          cd loki-streamos-checksums
          sha256sum -c *.sha256

      - name: Verify image format
        run: |
          cd loki-streamos-image
          file *.img
          du -h *.img
